[package]
name = "stdpipe_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.27", features = ["process", "fs", "signal"] }
anyhow = "1.0"
regex = "1.0"

[lib]
name = "stdpipe_rs"
path = "src/lib.rs"

[[bin]]
name = "stdpipe_back"
path = "src/stdpipe_back.rs"

[[bin]]
name = "stdpipe_serv"
path = "src/stdpipe_serv.rs"
